<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>卡牌 RTS 战棋 · 阶段 0 地基</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d1410;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        color: #cfd8d0;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #debug-panel {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 260px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        background: rgba(10, 18, 14, 0.88);
        border: 1px solid #2c4634;
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
        z-index: 10;
        user-select: none;
      }
      #debug-panel h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #9fd6a8;
        border-bottom: 1px solid #2c4634;
        padding-bottom: 6px;
      }
      #debug-panel .row {
        display: flex;
        justify-content: space-between;
        margin: 3px 0;
      }
      #debug-panel .row span:first-child {
        color: #8aa08f;
      }
      #debug-panel .row span:last-child {
        font-variant-numeric: tabular-nums;
        color: #e8f0e8;
      }
      #debug-panel .group {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed #2c4634;
      }
      #debug-panel .group .title {
        color: #9fd6a8;
        margin-bottom: 4px;
      }
      #debug-panel label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 3px 0;
        gap: 6px;
      }
      #debug-panel input[type='range'] {
        width: 120px;
        accent-color: #4caf6a;
      }
      #debug-panel input[type='checkbox'] {
        accent-color: #4caf6a;
      }
      #debug-panel .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }
      #debug-panel button {
        background: #1d3a26;
        color: #cfe8d4;
        border: 1px solid #33603f;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      #debug-panel button:hover {
        background: #2a5238;
      }
      #debug-panel .note {
        color: #6f8574;
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="debug-panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
